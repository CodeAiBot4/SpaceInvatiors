<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download File</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f4f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #ffffff;
    padding: 48px 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 360px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
    color: #18181b;
  }
  p {
    font-size: 14px;
    color: #71717a;
    margin: 0 0 24px;
  }
  a.button {
    display: inline-block;
    background: #18181b;
    color: #ffffff;
    text-decoration: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.15s ease;
  }
  a.button:hover {
    background: #3f3f46;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Download your file</h1>
  <p>Click the button below to download.</p>
  <a class="button" href="data:text/plain;charset=utf-8,Hello!%0AThis is your downloadable file." download="example.txt">
    Download File
  </a>
</div>

</body>
</html>
